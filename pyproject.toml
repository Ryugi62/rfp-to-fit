[project]
name = "rfp-to-fit"
version = "0.1.0"
description = "평가위원의 눈으로 빈칸을 먼저 찾는 R&D 기획 에이전트"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "httpx>=0.27",
  "pdfplumber>=0.11",
  "langgraph>=0.2",
  "streamlit>=1.40",
  "python-dotenv>=1.0",
  "mcp>=1.2",
  "olefile>=0.47",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: 실제 LLM API 호출"]
addopts = "-m 'not live'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfp_to_fit"]
